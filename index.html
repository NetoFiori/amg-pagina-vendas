<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMG Soluções Automotivas — Em Manutenção</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #1A1A1A;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      color: #F05A00;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1.1rem;
      color: #CCCCCC;
    }
  </style>
</head>
<body>
  <div>
    <h1>Site em manutenção</h1>
    <p>Voltamos em breve!</p>
  </div>
</body>
</html>
